<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer personnage · animations</title>
<style>
  :root { --bg:#17121c; --panel:#241b2b; --ink:#f3ecdf; --mute:#a99bb3; --gold:#f9d58b; --line:#3a2f44; --on:#4a3a2c; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f4efe6; --panel:#fffaf1; --ink:#2a1d15; --mute:#6f5f52; --gold:#9a6b1f; --line:#e2d6c2; --on:#f3e2c2; } }
  :root[data-theme="dark"] { --bg:#17121c; --panel:#241b2b; --ink:#f3ecdf; --mute:#a99bb3; --gold:#f9d58b; --line:#3a2f44; --on:#4a3a2c; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.35 system-ui, "Segoe UI", sans-serif; }
  .app { display:grid; grid-template-columns: 320px 1fr; height:100vh; }
  aside { background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:16px; margin:0 0 4px; color:var(--gold); }
  .count { color:var(--mute); font-size:12px; }
  .tools { padding:10px 16px; display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid var(--line); }
  input[type=search] { flex:1 1 100%; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  label.chk { color:var(--mute); font-size:12px; display:flex; gap:6px; align-items:center; }
  .list { overflow:auto; flex:1; padding:6px 0; }
  .clip { display:flex; justify-content:space-between; gap:8px; width:100%; text-align:left; padding:7px 16px; border:0; background:none; color:var(--ink); cursor:pointer; font:inherit; }
  .clip:hover { background:var(--on); }
  .clip.cur { background:var(--on); color:var(--gold); font-weight:700; }
  .clip small { color:var(--mute); white-space:nowrap; }
  .tag { font-size:11px; padding:1px 6px; border-radius:6px; border:1px solid var(--line); color:var(--mute); }
  .tag.used { color:var(--gold); border-color:var(--gold); }
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  #stage { flex:1; position:relative; min-height:0; }
  #stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .bar { padding:10px 16px; border-top:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .bar b { color:var(--gold); }
  button.ctl { padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer; font:inherit; }
  button.ctl:hover { border-color:var(--gold); }
  input[type=range] { width:180px; }
  #msg { position:absolute; left:16px; top:14px; color:var(--mute); font-size:13px; pointer-events:none; }
  @media (max-width: 760px) { .app { grid-template-columns: 1fr; grid-template-rows: 42vh 1fr; height:auto; min-height:100vh; } aside { order:2; } main { order:1; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>Personnage · toutes les animations</h1>
      <div class="count" id="count">Chargement…</div>
    </header>
    <div class="tools">
      <input type="search" id="q" placeholder="Filtrer (ex. pistol, run, kneel)">
      <label class="chk"><input type="checkbox" id="onlyUnused"> seulement celles non utilisées dans le jeu</label>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div id="stage"><div id="msg"></div></div>
    <div class="bar">
      <button class="ctl" id="play">⏸ Pause</button>
      <button class="ctl" id="prev">◀</button>
      <button class="ctl" id="next">▶</button>
      <label class="chk"><input type="checkbox" id="loop" checked> boucle</label>
      <label class="chk">vitesse <input type="range" id="speed" min="0.1" max="2" step="0.05" value="1"> <span id="spv">1.00×</span></label>
      <span>Animation : <b id="cur">—</b> <span id="dur" class="count"></span></span>
    </div>
  </main>
</div>

<script type="importmap">
  { "imports": {
      "three": "./assets/vendor/three/build/three.module.js",
      "three/addons/": "./assets/vendor/three/examples/jsm/",
      "three-mesh-bvh": "./assets/vendor/three-mesh-bvh/index.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { useMeshopt, loadModel } from './app/gltf-extras.js?v=1';

const MODEL = 'assets/models/personnage-sahel.glb?v=2';
const $ = (id) => document.getElementById(id);
const msg = (t) => { $('msg').textContent = t; };

// Renderer / scène
const stage = $('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2233);
scene.add(new THREE.HemisphereLight(0xffffff, 0x3a2f2a, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(3, 6, 4); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(1.2, 48), new THREE.MeshStandardMaterial({ color: 0x4b3f35, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 100);
camera.position.set(0, 1.25, 4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0); controls.enableDamping = true; controls.update();
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

// État d'animation
let mixer = null, model = null, clips = [], actions = [], index = -1, paused = false, playing = null;
const used = new Set();       // noms d'animations référencés dans le code du jeu (détection par texte)

function fmt(n) { return (n || 0).toFixed(2) + ' s'; }

function show(i) {
  if (!actions.length) return;
  index = (i + actions.length) % actions.length;
  const a = actions[index];
  if (playing) playing.fadeOut(0.2);
  a.reset().setLoop(THREE.LoopRepeat, Infinity).fadeIn(0.2).play();
  a.paused = paused; playing = a;
  $('cur').textContent = a.getClip().name;
  $('dur').textContent = fmt(a.getClip().duration);
  document.querySelectorAll('.clip').forEach((b, k) => b.classList.toggle('cur', k === index));
  const el = document.querySelectorAll('.clip')[index]; if (el) el.scrollIntoView({ block: 'nearest' });
}

function buildList() {
  const list = $('list'); list.innerHTML = '';
  clips.forEach((c, i) => {
    const b = document.createElement('button'); b.className = 'clip'; b.type = 'button';
    const isUsed = used.has(c.name.toLowerCase());
    b.dataset.name = c.name.toLowerCase();
    b.dataset.used = isUsed ? '1' : '0';
    b.innerHTML = `<span>${c.name}</span><small>${fmt(c.duration)} <span class="tag${isUsed ? ' used' : ''}">${isUsed ? 'dans le jeu' : 'non utilisée'}</span></small>`;
    b.addEventListener('click', () => show(i));
    list.appendChild(b);
  });
  applyFilter();
}
function applyFilter() {
  const q = $('q').value.trim().toLowerCase(), only = $('onlyUnused').checked;
  let shown = 0;
  document.querySelectorAll('.clip').forEach((b) => {
    const ok = (!q || b.dataset.name.includes(q)) && (!only || b.dataset.used === '0');
    b.style.display = ok ? '' : 'none'; if (ok) shown++;
  });
  $('count').textContent = `${shown} / ${clips.length} animations · ${clips.filter((c) => !used.has(c.name.toLowerCase())).length} non utilisées dans le jeu`;
}
$('q').addEventListener('input', applyFilter);
$('onlyUnused').addEventListener('change', applyFilter);
$('play').addEventListener('click', () => { paused = !paused; if (playing) playing.paused = paused; $('play').textContent = paused ? '▶ Lecture' : '⏸ Pause'; });
$('prev').addEventListener('click', () => show(index - 1));
$('next').addEventListener('click', () => show(index + 1));
$('loop').addEventListener('change', () => { if (playing) playing.setLoop($('loop').checked ? THREE.LoopRepeat : THREE.LoopOnce, Infinity); });
$('speed').addEventListener('input', () => { const v = +$('speed').value; mixer.timeScale = v; $('spv').textContent = v.toFixed(2) + '×'; });
window.addEventListener('keydown', (e) => {
  if (e.target && /INPUT/.test(e.target.tagName) && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
  if (e.key === 'ArrowRight') show(index + 1); else if (e.key === 'ArrowLeft') show(index - 1); else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});

// Animations référencées dans le code du jeu (pour marquer celles qui ne sont pas encore utilisées)
async function scanUsed() {
  const files = ['app/sanctuary-mode.js', 'app/anim-state.js', 'app/character-viewer.js'];
  for (const f of files) {
    try { const t = (await (await fetch(f)).text()).toLowerCase(); for (const c of clips) { const n = c.name.toLowerCase(); if (t.includes(`'${n}'`) || t.includes(`"${n}"`)) used.add(n); } } catch (_) {}
  }
}

// Chargement du modèle
const draco = new DRACOLoader();
draco.setDecoderPath('assets/vendor/three/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);
useMeshopt(loader);
msg('Chargement du modèle…');
loadModel(loader, MODEL, async (gltf) => {
  model = gltf.scene;
  model.traverse((o) => { if (o.isMesh) { o.castShadow = false; o.frustumCulled = false; } });
  // pieds sur le sol, centré, environ 1,8 m
  const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());
  const s = size.y > 0 ? 1.78 / size.y : 1; model.scale.setScalar(s);
  const b2 = new THREE.Box3().setFromObject(model); model.position.y -= b2.min.y; model.position.x -= (b2.min.x + b2.max.x) / 2; model.position.z -= (b2.min.z + b2.max.z) / 2;
  scene.add(model);
  mixer = new THREE.AnimationMixer(model);
  clips = gltf.animations.slice().sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  actions = clips.map((c) => mixer.clipAction(c));
  await scanUsed();
  buildList();
  msg('');
  show(0);
}, undefined, (e) => { msg('Erreur de chargement du modèle : ' + (e && e.message ? e.message : e)); });

// Boucle de rendu
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (mixer) mixer.update(paused ? 0 : dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
